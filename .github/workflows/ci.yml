name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Patient app typecheck
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Admin app typecheck
        run: npx tsc --noEmit --project admin/tsconfig.json

      - name: Server typecheck
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Build all apps
        run: npm run build

  # The suite TRUNCATEs and reseeds tables (see server/test/setup.ts), so it gets its own
  # throwaway Postgres. It never reads DATABASE_URL, which is why this is safe to run on PRs.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: physio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/physio_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/physio_test
      # config.ts validates these at import time (getCoreConfig/getConfig). Without them
      # every authed route 400s. Tests mock the Razorpay + Supabase SDKs, so throwaway
      # literals are enough -- never real credentials.
      JWT_SECRET: ci-test-secret-not-used-for-auth
      APP_URL: http://localhost:4000
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
      RAZORPAY_KEY_ID: ci_test_key
      RAZORPAY_KEY_SECRET: ci_test_secret
      RAZORPAY_WEBHOOK_SECRET: ci_test_webhook_secret
      # jaasMeetingUrl() only reads JAAS_APP_ID. The patient join flow uses the
      # video-token endpoint, but booking also stores this link, so the suite
      # asserts the stored value.
      JAAS_APP_ID: ci-test-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate --workspace server

      - name: Seed baseline content
        run: npm run db:seed --workspace server

      - name: Test
        run: npm test --workspace server
